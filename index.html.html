<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP CRUD · Users (index.html)</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f6fb;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1.5rem;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* table card */
        .table-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            padding: 1.75rem 1.75rem 1.25rem;
            border: 1px solid #e9eef3;
        }

        .header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }

        .header-row h2 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .header-row h2 i {
            color: #2563eb;
            background: #e0e9ff;
            padding: 0.45rem;
            border-radius: 14px;
            font-size: 1.3rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.6rem 1.3rem;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            line-height: 1;
            background: #ffffff;
            color: #1e293b;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #dbe1ea;
        }

        .btn i {
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 8px -2px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-warning {
            background: #f59e0b;
            border-color: #f59e0b;
            color: #1e293b;
            box-shadow: 0 4px 8px -2px rgba(245, 158, 11, 0.2);
        }

        .btn-warning:hover {
            background: #d97706;
            border-color: #d97706;
            color: #ffffff;
        }

        .btn-danger {
            background: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 8px -2px rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: #dc2626;
            border-color: #dc2626;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .btn-sm {
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            border-radius: 30px;
        }

        .btn-sm i {
            font-size: 0.75rem;
        }

        /* table */
        .table-responsive {
            overflow-x: auto;
            border-radius: 18px;
            margin: 0 -0.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th {
            text-align: left;
            padding: 1rem 0.75rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            background: #fafcff;
        }

        td {
            padding: 0.95rem 0.75rem;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f9fcff;
            transition: background 0.15s;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .text-center {
            text-align: center;
        }

        .py-4 {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .text-muted {
            color: #64748b;
        }

        .mb-0 {
            margin-bottom: 0;
        }

        .mt-3 {
            margin-top: 1.5rem;
        }

        .fa-inbox {
            color: #94a3b8;
        }

        .d-block {
            display: block;
        }

        .mb-2 {
            margin-bottom: 0.5rem;
        }

        .text-danger {
            color: #ef4444;
        }

        /* flash message */
        .flash-message {
            background: #dcfce7;
            border-left: 6px solid #22c55e;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
            color: #166534;
            box-shadow: 0 4px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid #bbf7d0;
        }

        .flash-message i {
            font-size: 1.2rem;
            color: #22c55e;
        }

        .flash-message.danger {
            background: #fee2e2;
            border-left-color: #ef4444;
            border-color: #fecaca;
            color: #991b1b;
        }

        .flash-message.danger i {
            color: #ef4444;
        }

        /* modal overlay for form (create/edit) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s, visibility 0.2s;
            padding: 1rem;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .form-container {
            background: #ffffff;
            border-radius: 28px;
            max-width: 520px;
            width: 100%;
            padding: 2rem 2rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid #e9eef3;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-container h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #0f172a;
        }

        .form-container h2 i {
            color: #2563eb;
            background: #e0e9ff;
            padding: 0.4rem;
            border-radius: 14px;
        }

        .form-group {
            margin-bottom: 1.35rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: #1e293b;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            border: 1px solid #dbe1ea;
            font-size: 0.95rem;
            font-family: inherit;
            background: #ffffff;
            transition: border 0.15s, box-shadow 0.15s;
            outline: none;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-control.is-invalid {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .invalid-feedback {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .mt-4 {
            margin-top: 1.8rem;
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
            padding: 0.25rem;
            border-radius: 50%;
            transition: background 0.15s, color 0.15s;
        }

        .modal-close:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        /* small utility */
        .d-flex {
            display: flex;
            gap: 0.5rem;
        }

        .flex-wrap {
            flex-wrap: wrap;
        }

        .gap-2 {
            gap: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- flash message container (dynamically updated) -->
    <div id="flashContainer"></div>

    <!-- main table card -->
    <div class="table-container">
        <div class="header-row">
            <h2><i class="fas fa-users"></i> PHP CRUD Operation</h2>
            <button class="btn btn-primary" id="addUserBtn">
                <i class="fas fa-plus-circle"></i> Add New User
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover" id="usersTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- dynamic rows -->
                </tbody>
            </table>
        </div>

        <p class="text-muted mt-3 mb-0" style="font-size:0.9rem;" id="totalUsersInfo">
            <i class="fas fa-info-circle"></i> Total users: <span id="userCount">0</span>
        </p>
    </div>
</div>

<!-- modal overlay (used for both create and edit) -->
<div class="modal-overlay" id="formModal">
    <div class="form-container">
        <button class="modal-close" id="closeModalBtn">&times;</button>
        <h2 id="modalTitle"><i class="fas fa-user-plus"></i> Add New User</h2>

        <form id="userForm" novalidate>
            <input type="hidden" id="userId" value="">

            <div class="form-group">
                <label for="name">Name <span class="text-danger">*</span></label>
                <input type="text" name="name" id="name"
                       class="form-control" placeholder="Enter full name">
                <div class="invalid-feedback" id="nameError" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="text-danger">*</span></label>
                <input type="email" name="email" id="email"
                       class="form-control" placeholder="Enter email address">
                <div class="invalid-feedback" id="emailError" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label for="phone">Phone <span class="text-danger">*</span></label>
                <input type="text" name="phone" id="phone"
                       class="form-control" placeholder="Enter phone number">
                <div class="invalid-feedback" id="phoneError" style="display: none;"></div>
            </div>

            <div class="mt-4 d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary" id="saveBtn">
                    <i class="fas fa-save"></i> Save User
                </button>
                <button type="button" class="btn btn-secondary" id="cancelBtn">
                    <i class="fas fa-arrow-left"></i> Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    (function() {
        // ---------- initial seed data (same as in PHP but local) ----------
        let users = [
            { id: 1, name: 'Alice Johnson', email: 'alice@example.com', phone: '+1 555 0101' },
            { id: 2, name: 'Bob Smith', email: 'bob@example.com', phone: '+1 555 0102' },
            { id: 3, name: 'Carol White', email: 'carol@example.com', phone: '+1 555 0103' },
        ];

        // next id for new users
        let nextId = 4;

        // DOM elements
        const tbody = document.getElementById('usersTableBody');
        const userCountSpan = document.getElementById('userCount');
        const flashContainer = document.getElementById('flashContainer');

        const modal = document.getElementById('formModal');
        const modalTitle = document.getElementById('modalTitle');
        const userForm = document.getElementById('userForm');
        const userIdInput = document.getElementById('userId');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const phoneError = document.getElementById('phoneError');
        const addUserBtn = document.getElementById('addUserBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // ---------- helper functions ----------
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // show flash message
        function showFlash(type, message) {
            const flashDiv = document.createElement('div');
            flashDiv.className = `flash-message ${type === 'danger' ? 'danger' : ''}`;
            flashDiv.innerHTML = `<i class="fas ${type === 'danger' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${escapeHtml(message)}`;
            flashContainer.innerHTML = '';
            flashContainer.appendChild(flashDiv);
            // auto-hide after 4 sec
            setTimeout(() => {
                if (flashContainer.contains(flashDiv)) {
                    flashDiv.style.opacity = '0';
                    flashDiv.style.transition = 'opacity 0.3s';
                    setTimeout(() => flashDiv.remove(), 300);
                }
            }, 4000);
        }

        // ---------- render user table ----------
        function renderUsers() {
            if (!tbody) return;
            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-4">
                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                            No users found. Click "Add New User" to create one.
                        </td>
                    </tr>
                `;
                userCountSpan.textContent = '0';
                return;
            }

            let html = '';
            users.forEach((user, index) => {
                html += `
                    <tr data-id="${user.id}">
                        <td>${index + 1}</td>
                        <td>${escapeHtml(user.name)}</td>
                        <td>${escapeHtml(user.email)}</td>
                        <td>${escapeHtml(user.phone)}</td>
                        <td class="action-buttons">
                            <button class="btn btn-warning btn-sm editBtn" data-id="${user.id}" data-name="${escapeHtml(user.name)}">
                                <i class="fas fa-pencil"></i> Edit
                            </button>
                            <button class="btn btn-danger btn-sm deleteBtn" data-id="${user.id}" data-name="${escapeHtml(user.name)}">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            userCountSpan.textContent = users.length;
        }

        // ---------- validation ----------
        function validateForm() {
            let isValid = true;

            // reset errors
            [nameError, emailError, phoneError].forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
            [nameInput, emailInput, phoneInput].forEach(el => el.classList.remove('is-invalid'));

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();
            const currentId = userIdInput.value ? parseInt(userIdInput.value) : null;

            // name
            if (name === '') {
                nameError.textContent = 'Name is required.';
                nameError.style.display = 'flex';
                nameInput.classList.add('is-invalid');
                isValid = false;
            } else if (name.length > 100) {
                nameError.textContent = 'Name must not exceed 100 characters.';
                nameError.style.display = 'flex';
                nameInput.classList.add('is-invalid');
                isValid = false;
            }

            // email
            if (email === '') {
                emailError.textContent = 'Email is required.';
                emailError.style.display = 'flex';
                emailInput.classList.add('is-invalid');
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailError.textContent = 'Please enter a valid email address.';
                emailError.style.display = 'flex';
                emailInput.classList.add('is-invalid');
                isValid = false;
            } else {
                // duplicate check (excluding current user when editing)
                const duplicate = users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== currentId);
                if (duplicate) {
                    emailError.textContent = 'This email is already registered.';
                    emailError.style.display = 'flex';
                    emailInput.classList.add('is-invalid');
                    isValid = false;
                }
            }

            // phone
            if (phone === '') {
                phoneError.textContent = 'Phone is required.';
                phoneError.style.display = 'flex';
                phoneInput.classList.add('is-invalid');
                isValid = false;
            } else if (phone.length > 30) {
                phoneError.textContent = 'Phone must not exceed 30 characters.';
                phoneError.style.display = 'flex';
                phoneInput.classList.add('is-invalid');
                isValid = false;
            }

            return isValid;
        }

        // ---------- open modal for create ----------
        function openCreateModal() {
            userForm.reset();
            userIdInput.value = '';
            modalTitle.innerHTML = '<i class="fas fa-user-plus"></i> Add New User';
            // clear errors
            [nameError, emailError, phoneError].forEach(el => el.style.display = 'none');
            [nameInput, emailInput, phoneInput].forEach(el => el.classList.remove('is-invalid'));
            modal.classList.add('active');
            nameInput.focus();
        }

        // ---------- open modal for edit ----------
        function openEditModal(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;

            userForm.reset();
            userIdInput.value = user.id;
            nameInput.value = user.name;
            emailInput.value = user.email;
            phoneInput.value = user.phone;

            modalTitle.innerHTML = '<i class="fas fa-user-edit"></i> Edit User';
            [nameError, emailError, phoneError].forEach(el => el.style.display = 'none');
            [nameInput, emailInput, phoneInput].forEach(el => el.classList.remove('is-invalid'));
            modal.classList.add('active');
            nameInput.focus();
        }

        // ---------- close modal ----------
        function closeModal() {
            modal.classList.remove('active');
            userForm.reset();
            userIdInput.value = '';
            [nameError, emailError, phoneError].forEach(el => el.style.display = 'none');
            [nameInput, emailInput, phoneInput].forEach(el => el.classList.remove('is-invalid'));
        }

        // ---------- handle form submit (create or update) ----------
        function handleFormSubmit(e) {
            e.preventDefault();
            if (!validateForm()) return;

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();
            const id = userIdInput.value ? parseInt(userIdInput.value) : null;

            if (id) {
                // update
                const index = users.findIndex(u => u.id === id);
                if (index !== -1) {
                    users[index] = { ...users[index], name, email, phone };
                    showFlash('success', `User "${name}" was updated successfully.`);
                }
            } else {
                // create
                const newUser = {
                    id: nextId++,
                    name,
                    email,
                    phone
                };
                users.push(newUser);
                showFlash('success', `User "${name}" was created successfully.`);
            }

            renderUsers();
            closeModal();
        }

        // ---------- delete user (with confirmation) ----------
        function deleteUser(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            if (!confirm(`Are you sure you want to delete "${user.name}"?`)) return;

            users = users.filter(u => u.id !== id);
            renderUsers();
            showFlash('success', `User "${user.name}" was deleted successfully.`);

            // if the modal is open for the deleted user, close it (safety)
            if (userIdInput.value && parseInt(userIdInput.value) === id) {
                closeModal();
            }
        }

        // ---------- event delegation for edit/delete buttons ----------
        tbody.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.editBtn');
            const deleteBtn = e.target.closest('.deleteBtn');

            if (editBtn) {
                const id = parseInt(editBtn.dataset.id);
                openEditModal(id);
            }

            if (deleteBtn) {
                const id = parseInt(deleteBtn.dataset.id);
                deleteUser(id);
            }
        });

        // ---------- attach event listeners ----------
        addUserBtn.addEventListener('click', openCreateModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        userForm.addEventListener('submit', handleFormSubmit);

        // close modal on overlay click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // escape key closes modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // ---------- initial render ----------
        renderUsers();
    })();
</script>
</body>
</html>
